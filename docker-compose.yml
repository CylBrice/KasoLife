version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kasolife-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kasolife}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=en_US.UTF-8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kasolife-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  redis:
    image: redis:7-alpine
    container_name: kasolife-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kasolife-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  livekit:
    image: livekit/livekit-server:v1.13.6
    container_name: kasolife-livekit
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.dev.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50100:50000-50100/udp"
    networks:
      - kasolife-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kasolife-backend
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      klando-keygen-kasolife:
        condition: service_started
      livekit:
        condition: service_started
    environment:
      # URLs internes Docker — ne peuvent pas venir du .env car elles utilisent les noms de services
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-kasolife}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      KLANDO_KEYGEN_URL: http://klando-keygen-kasolife:3102
      LIVEKIT_URL: http://livekit:7880
      NODE_ENV: production
      PORT: 3003
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3003/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - kasolife-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '1'
          memory: 512M

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3003}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://backend:3003}
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:-}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
        NEXT_PUBLIC_FIREBASE_RECAPTCHA_SITE_KEY: ${NEXT_PUBLIC_FIREBASE_RECAPTCHA_SITE_KEY:-}
    container_name: kasolife-web
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:3003}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://backend:3003}
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3002/"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3
    networks:
      - kasolife-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  klando-keygen-kasolife:
    image: node:20-alpine
    container_name: klando-keygen-kasolife
    working_dir: /app
    volumes:
      - /opt/klando/klando_keygen.js:/app/klando_keygen.js:ro
    command: ["node", "/app/klando_keygen.js"]
    environment:
      KEYGEN_PORT: 3102
      APP_ID: kasolife
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3102/session-key"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    # Pas de "ports:" — uniquement accessible via le réseau Docker interne
    networks:
      - kasolife-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  kasolife-deploy:
    image: alpine:latest
    container_name: kasolife-deploy
    restart: unless-stopped
    command: ["tail", "-n", "100", "-f", "/deploy/deploy.log"]
    volumes:
      - /opt/kasolife/logs:/deploy
    networks:
      - kasolife-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kasolife-network:
    driver: bridge
