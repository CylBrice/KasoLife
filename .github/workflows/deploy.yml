name: Deploy KasoLife to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 62.171.155.184
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/kasolife
            git pull origin main
            docker compose pull
            docker compose up -d --build
            docker image prune -f
