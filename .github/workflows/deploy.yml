name: Deploy KasoLife to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 62.171.155.184
          username: root
          key: ${{ secrets.VPS_SSH_KEY_CONTABO }}
          script: |
            LOG=/opt/kasolife/logs/deploy.log
            echo "" >> $LOG
            echo "================================================" >> $LOG
            echo "Deploy KasoLife — $(date '+%Y-%m-%d %H:%M:%S %Z')" >> $LOG
            echo "================================================" >> $LOG
            cd /opt/kasolife
            echo "[1/4] git pull..." >> $LOG
            git pull origin main >> $LOG 2>&1
            echo "[2/4] docker compose pull..." >> $LOG
            docker compose pull >> $LOG 2>&1
            echo "[3/4] docker compose up --build..." >> $LOG
            docker compose up -d --build >> $LOG 2>&1
            echo "[4/4] docker image prune..." >> $LOG
            docker image prune -f >> $LOG 2>&1
            echo "✓ Deploy terminé — $(date '+%Y-%m-%d %H:%M:%S %Z')" >> $LOG
